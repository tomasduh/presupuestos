app = "mi-mudanza-presupuestos"
primary_region = "gru"

[build]

[env]
  PORT = "4321"
  DATA_DIR = "/data"

[[mounts]]
  source = "presupuestos_data"
  destination = "/data"

[http_service]
  internal_port = 4321
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
